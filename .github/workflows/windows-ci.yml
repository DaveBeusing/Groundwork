name: Groundwork Windows CI

on:
  pull_request:
    branches:
      - master
      - build/wp01-b00-bootstrap
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build, package and integrity checks
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Configure fresh package cache
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'groundwork-test-nuget-cache'
          "NUGET_PACKAGES=$cache" >> $env:GITHUB_ENV

      - name: Validate solution, restore, build and test
        run: ./scripts/Verify-Bootstrap.ps1 -TestResultsDirectory (Join-Path $env:RUNNER_TEMP 'groundwork-test-results')

      - name: Require D3D12 WARP color, transform and depth readback
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'groundwork-test-results/Groundwork.Rendering.D3D12.Tests/results.trx'
          [xml]$report = Get-Content -LiteralPath $reportPath -Raw
          $passed = @($report.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Passed' | ForEach-Object testName)
          foreach ($test in @('ClearWritesTheExpectedRgbaAndDepth', 'AsymmetricWorldViewAndProjectionPutTheCubeAtThePredictedPixel',
            'DepthReadbackPreservesTheNearCubeWhenTheFarCubeDrawsLast',
            'WarpTerrainReadbackDrawsBothMeshesAndPreservesNearestDepth',
            'WarpMeshReplacementReadbackDrawsTheNewPairWithDepth',
            'WarpRegionReplacementReadbackKeepsTheSeamAndClearsLeavingGeometry',
            'WarpRegionReadbackUsesVertexColorsAndPreservesNearestDepth',
            'WarpPlanetTerrainReadbackSurvivesLodAndOriginChange',
            'WarpFlightTerrainReadbackSurvivesBothViewAndOriginTransitions', 'WarpVolumeReadbackCoversTransitionAndCavityAcrossRebase',
            'WarpVolumeColorPolicyReadbackAcrossLodSeamAndRebase', 'WarpDistanceFogReadbackUsesViewDepthAndPreservesRebase', 'WarpCubeSphereTransitionsMatchCollisionAcrossRebase', 'WarpGeologyPortalReadbackMatchesCollisionAfterRebase',
            'WarpLandingPadColorAndSilhouetteAreVisibleOnApproach')) {
            if ($passed -cnotcontains $test) { throw "Mandatory WARP readback did not pass: $test" }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groundwork-test-results
          path: ${{ runner.temp }}/groundwork-test-results/
          if-no-files-found: warn

      - name: Build unique packages and manifest
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "0.1.0-dev.$env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT"
          $buildId = "$env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT"
          $packageDir = 'artifacts/packages'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          foreach ($module in @('Core','Platform.Windows','Simulation','Ecs','Jobs','Diagnostics','Rendering','Rendering.D3D12','Voxels','Persistence')) {
            & dotnet pack "src/Groundwork.$module/Groundwork.$module.csproj" -c Release --no-build --no-restore "-p:PackageVersion=$version" -o $packageDir
            if ($LASTEXITCODE -ne 0) { throw "Package build failed: $module" }
          }
          $manifest = Join-Path $packageDir 'manifest.json'
          & ./eng/New-PackageManifest.ps1 -PackageDirectory $packageDir -Version $version -SourceCommit $env:GITHUB_SHA -BuildId $buildId -OutputManifest $manifest
          $digest = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash
          "GROUNDWORK_PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          "GROUNDWORK_MANIFEST_SHA256=$digest" >> $env:GITHUB_ENV
          "### Package evidence" >> $env:GITHUB_STEP_SUMMARY
          "- Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "- Run: $env:GITHUB_RUN_ID attempt $env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_STEP_SUMMARY
          "- Package version: $version" >> $env:GITHUB_STEP_SUMMARY
          "- Manifest SHA-256: $digest" >> $env:GITHUB_STEP_SUMMARY
          "- Trust scope: PR builds are not approved releases" >> $env:GITHUB_STEP_SUMMARY

      - name: Verify staging and reject tampering
        run: |
          $manifest = 'artifacts/packages/manifest.json'
          $feed = Join-Path $env:RUNNER_TEMP 'groundwork-verified-feed'
          New-Item -ItemType Directory -Path $feed -Force | Out-Null
          & ./eng/Stage-VerifiedPackages.ps1 -ManifestPath $manifest -PackageDirectory 'artifacts/packages' -FeedDirectory $feed -ExpectedManifestSha256 $env:GROUNDWORK_MANIFEST_SHA256 -ExpectedSourceCommit $env:GITHUB_SHA
          & ./eng/Test-PackageIntegrity.ps1 -ManifestPath $manifest -PackageDirectory 'artifacts/packages' -ExpectedManifestSha256 $env:GROUNDWORK_MANIFEST_SHA256 -ExpectedSourceCommit $env:GITHUB_SHA

      - name: Isolated package consumer
        run: |
          & ./eng/Test-IsolatedNuGetConsumer.ps1 -PackageDirectory 'artifacts/packages' -ManifestPath 'artifacts/packages/manifest.json' -ExpectedManifestSha256 $env:GROUNDWORK_MANIFEST_SHA256 -ExpectedSourceCommit $env:GITHUB_SHA -Version $env:GROUNDWORK_PACKAGE_VERSION

      - name: Upload package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groundwork-packages
          path: artifacts/packages/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
